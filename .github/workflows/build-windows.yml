name: Build & Release App

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  draft:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      has_cn: ${{ steps.check_cn.outputs.has_cn }}
    steps:
      - uses: actions/checkout@v4
      - name: Check CrabNebula Secrets
        id: check_cn
        env:
          CN_API_KEY: ${{ secrets.CN_API_KEY }}
          CN_APPLICATION: ${{ secrets.CN_APPLICATION }}
        run: |
          if [ -n "$CN_API_KEY" ] && [ -n "$CN_APPLICATION" ]; then
            echo "has_cn=true" >> $GITHUB_OUTPUT
          else
            echo "has_cn=false" >> $GITHUB_OUTPUT
          fi
      - name: Draft Release in CrabNebula Cloud
        if: steps.check_cn.outputs.has_cn == 'true'
        id: draft
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release draft ${{ secrets.CN_APPLICATION }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Last Token v__VERSION__'
          releaseBody: 'Release assets built via CI.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload to CrabNebula Cloud
        if: needs.draft.outputs.has_cn == 'true' && needs.draft.outputs.release_id != ''
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release upload ${{ secrets.CN_APPLICATION }} --release ${{ needs.draft.outputs.release_id }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}

  publish:
    needs: [draft, build]
    if: needs.draft.outputs.has_cn == 'true' && needs.draft.outputs.release_id != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Publish CrabNebula Release
        uses: crabnebula-dev/cloud-release@v0
        with:
          command: release publish ${{ secrets.CN_APPLICATION }} --release ${{ needs.draft.outputs.release_id }} --framework tauri
          api-key: ${{ secrets.CN_API_KEY }}
