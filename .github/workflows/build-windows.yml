name: Build & Release App

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            target: ""
          - platform: "windows-latest"
            target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb1-dev libwayland-dev \
            libfontconfig1-dev libssl-dev pkg-config

      # ponytail: plain release binaries for now; installer/signing pipeline
      # (dmg, NSIS, notarization) needs a bundler decision for gpui-kit.
      - name: Build release binary
        run: cargo build --release --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp target/release/last-token.exe dist/last-token-windows-x86_64.exe
          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            cp target/${{ matrix.target }}/release/last-token dist/last-token-macos-aarch64
          else
            cp target/release/last-token dist/last-token-linux-x86_64
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: last-token-${{ matrix.platform }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Last Token ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
